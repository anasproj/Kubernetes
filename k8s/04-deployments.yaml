apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-a
  namespace: tp-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
        - name: container-a
          image: app-a:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: config-urls
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-b
  namespace: tp-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-b
  template:
    metadata:
      labels:
        app: app-b
    spec:
      containers:
        - name: container-b
          image: app-b:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: config-urls
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-c
  namespace: tp-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-c
  template:
    metadata:
      labels:
        app: app-c
    spec:
      containers:
        - name: container-c
          image: app-c:1.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: data-storage
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
      volumes:
        - name: data-storage
          persistentVolumeClaim:
            claimName: volume-c